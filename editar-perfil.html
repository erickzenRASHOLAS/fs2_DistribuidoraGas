<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil - Gas El Volcán</title>


    <link href="./assets/css/style.css" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans flex flex-col min-h-screen">


<!-- NOTA: Mismo menú superior manteniendo "Mi Perfil" como la sección activa. -->
<header class="w-full">
    <nav class="bg-white shadow-md border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center h-20">
            <a href="./index.html" class="flex items-center gap-2">
                <div class="bg-yellow-400 p-2 rounded-xl text-blue-950 font-black text-xl flex items-center">
                    <i class="ph ph-flame-fill text-2xl mr-1"></i> VOLCÁN
                </div>
            </a>
            <div class="hidden lg:flex items-center space-x-8 font-medium text-slate-700">
                <a href="./index.html" class="hover:text-blue-900 transition">Inicio</a>
                <a href="./pedido.html" class="hover:text-blue-900 transition">Pide tu Cilindro</a>
                <a href="./mis-pedidos.html" class="hover:text-blue-900 transition">Mis Pedidos</a>
                <a href="./perfil.html" class="text-blue-900 border-b-2 border-yellow-400 pb-1 font-bold">Mi Perfil</a>
            </div>
            <div class="hidden sm:flex items-center gap-4">
                <a href="login.html" class="text-slate-600 hover:text-blue-900 font-bold transition flex items-center gap-2">
                    <i class="ph ph-sign-out text-xl"></i> Cerrar Sesión
                </a>
            </div>
        </div>
    </nav>
</header>


<main class="flex-grow flex items-start justify-center p-4 sm:p-8 mt-4 sm:mt-10">
    <section class="bg-white w-full max-w-2xl rounded-3xl shadow-md border border-slate-200 overflow-hidden">


        <div class="bg-blue-950 px-8 py-6 flex items-center gap-4 text-white">
            <!-- NOTA: Botón simple para regresar al perfil sin guardar los cambios. -->
            <a href="./perfil.html" class="text-slate-300 hover:text-white transition">
                <i class="ph ph-arrow-left text-2xl"></i>
            </a>
            <h1 class="text-xl font-extrabold">Editar mis datos</h1>
        </div>


        <!-- NOTA: Formulario con 'novalidate' para controlar los errores mediante JavaScript. -->
        <form id="form-editar-perfil" class="p-8 space-y-6" novalidate>


            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                <div>
                    <label for="edit-nombre" class="block text-sm font-bold text-slate-700 mb-1">Nombre Completo</label>
                    <input type="text" id="edit-nombre"
                           class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-yellow-400 outline-none font-medium text-slate-800">
                </div>
                <div>
                    <label for="edit-telefono" class="block text-sm font-bold text-slate-700 mb-1">Teléfono</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500 font-bold text-sm">+56 9</span>
                        <input type="tel" id="edit-telefono"
                               class="w-full pl-14 pr-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-yellow-400 outline-none font-medium text-slate-800">
                    </div>
                </div>
            </div>


            <div>
                <label for="edit-correo" class="block text-sm font-bold text-slate-700 mb-1">Correo Electrónico</label>
                <input type="email" id="edit-correo"
                       class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-yellow-400 outline-none font-medium text-slate-800 bg-slate-50">
            </div>


            <div>
                <label for="edit-direccion" class="block text-sm font-bold text-slate-700 mb-1">Dirección de Despacho Principal</label>
                <input type="text" id="edit-direccion"
                       class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-yellow-400 outline-none font-medium text-slate-800">
            </div>


            <!-- Contenedor dinámico de errores -->
            <div id="edit-error" class="hidden bg-red-50 text-red-600 text-sm font-semibold p-3 rounded-lg flex items-start gap-2 border border-red-200">
                <i class="ph ph-warning-circle text-lg mt-0.5"></i>
                <span id="edit-error-text">Error en el formulario.</span>
            </div>


            <div class="pt-4 border-t border-slate-200 flex flex-col sm:flex-row justify-end gap-3">
                <a href="./perfil.html" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-center font-bold py-3 px-6 rounded-xl transition">
                    Cancelar
                </a>
                <button type="submit" class="bg-yellow-400 hover:bg-yellow-500 text-blue-950 font-extrabold py-3 px-8 rounded-xl transition shadow-md flex justify-center items-center gap-2">
                    Guardar Cambios <i class="ph ph-floppy-disk text-xl"></i>
                </button>
            </div>
        </form>
    </section>
</main>


<footer class="bg-blue-950 text-slate-400 text-center py-6 text-sm border-t-4 border-yellow-400 mt-auto">
    &copy; 2026 Gas El Volcán S.A.
</footer>


<script src="./assets/js/editar-perfil.js"></script>
</body>
</html>
