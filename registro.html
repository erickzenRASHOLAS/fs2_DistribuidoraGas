<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Público - Gas El Volcán</title>
    <link href="./assets/css/style.css" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans flex items-center justify-center min-h-screen p-4">

<div class="bg-white w-full max-w-md p-8 rounded-3xl shadow-lg border border-slate-200">
    <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center bg-yellow-400 p-3 rounded-2xl mb-4">
            <i class="ph ph-fire text-3xl text-blue-950"></i>
        </div>
        <h1 class="text-2xl font-black text-blue-950">Crea tu cuenta</h1>
        <p class="text-slate-500 text-sm mt-1">Pide tu gas a domicilio más rápido</p>
    </div>

    <!-- Contenedor dinámico de mensajes -->
    <div id="registro-msg" class="hidden mb-4 text-sm font-semibold p-3 rounded-xl border"></div>

    <form id="form-registro" class="space-y-4">
        <div>
            <label class="block text-sm font-bold text-slate-700 mb-1">Nombre Completo</label>
            <input type="text" id="reg-nombre" class="w-full border border-slate-300 rounded-lg p-2 outline-none focus:ring-2 focus:ring-yellow-400" placeholder="Ej. María González">
        </div>
        <div>
            <label class="block text-sm font-bold text-slate-700 mb-1">Dirección de entrega (Chillán)</label>
            <input type="text" id="reg-direccion" class="w-full border border-slate-300 rounded-lg p-2 outline-none focus:ring-2 focus:ring-yellow-400" placeholder="Ej. Los Pinos 123">
        </div>
        <div>
            <label class="block text-sm font-bold text-slate-700 mb-1">Teléfono</label>
            <input type="tel" id="reg-telefono" class="w-full border border-slate-300 rounded-lg p-2 outline-none focus:ring-2 focus:ring-yellow-400" placeholder="Ej. +56912345678">
        </div>
        <div>
            <label class="block text-sm font-bold text-slate-700 mb-1">Contraseña</label>
            <input type="password" id="reg-pass1" class="w-full border border-slate-300 rounded-lg p-2 outline-none focus:ring-2 focus:ring-yellow-400" placeholder="Mínimo 6 caracteres">
        </div>
        <div>
            <label class="block text-sm font-bold text-slate-700 mb-1">Confirmar Contraseña</label>
            <input type="password" id="reg-pass2" class="w-full border border-slate-300 rounded-lg p-2 outline-none focus:ring-2 focus:ring-yellow-400" placeholder="Repite tu contraseña">
        </div>

        <button type="submit" class="w-full bg-blue-950 hover:bg-blue-900 text-white font-bold py-3 px-4 rounded-xl transition mt-6">Registrarme</button>
    </form>

    <div class="mt-6 text-center text-sm">
        <span class="text-slate-500">¿Ya tienes cuenta?</span>
        <a href="./perfil.html" class="text-blue-600 font-bold hover:underline">Inicia sesión</a>
    </div>
</div>

<script src="./assets/js/registro.js"></script>
</body>
</html>
